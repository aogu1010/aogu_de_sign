        <div style="margin-top:clamp(18px,3.5vw,28px); display:flex; flex-direction:column; gap:clamp(6px,1.5vw,10px);">
          <span style="font-family:'Zen Kaku Gothic Antique',sans-serif; font-weight:900; font-size:clamp(14px,3.6vw,15px); letter-spacing:0.04em; color:#1FAF57; line-height:1;">ビ<span style="color:#ffffff;">ュ</span>ンビ<span style="color:#ffffff;">ュ</span>ン</span>
          <span style="font-family:'Zen Kaku Gothic Antique',sans-serif; font-weight:900; font-size:clamp(14px,3.6vw,15px); letter-spacing:0.04em; line-height:1;"><span style="color:#E0392B;">ゴ</span><span style="color:#ffffff;">ワ</span><span style="color:#2150C8;">ゴ</span><span style="color:#ffffff;">ワ</span></span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 430, &quot;height&quot;: 920}, &quot;bgTone&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;black&quot;, &quot;options&quot;: [&quot;black&quot;, &quot;charcoal&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;配色&quot;}, &quot;revealMotion&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;fade-up&quot;, &quot;options&quot;: [&quot;fade-up&quot;, &quot;fade&quot;, &quot;none&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;演出&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    this.applyTheme();
    this.setupReveal();
  }
  componentDidUpdate() {
    this.applyTheme();
    const motion = (this.props && this.props.revealMotion) || 'fade-up';
    if (motion !== this._motion) this.setupReveal();
  }
  componentWillUnmount() {
    this.clearReveal();
  }
  clearReveal() {
    [this._fallback, this._t1, this._t2].forEach((t) => { if (t) clearTimeout(t); });
    if (this._check) {
      window.removeEventListener('scroll', this._check);
      window.removeEventListener('resize', this._check);
    }
  }
  qsa(sel) {
    return Array.from(document.querySelectorAll(sel));
  }
  applyTheme() {
    const p = this.props || {};
    const tone = p.bgTone || 'black';
    const base = tone === 'charcoal' ? '#1b1b1b' : '#0E0E0E';
    const alt = tone === 'charcoal' ? '#242424' : '#141414';
    this.qsa('[data-bg="base"]').forEach((el) => { el.style.background = base; });
    this.qsa('[data-bg="alt"]').forEach((el) => { el.style.background = alt; });
  }
  setupReveal() {
    this.clearReveal();
    const motion = (this.props && this.props.revealMotion) || 'fade-up';
    this._motion = motion;
    const items = this.qsa('[data-reveal]');
    const ease = 'cubic-bezier(.2,.6,.2,1)';
    items.forEach((it) => {
      const d = parseInt(it.getAttribute('data-d') || '0', 10);
      delete it.dataset.shown;
      it.style.willChange = 'opacity, transform';
      it.style.transition = 'opacity .85s ' + ease + ' ' + d + 'ms, transform .9s ' + ease + ' ' + d + 'ms';
      if (motion === 'none') {
        it.style.opacity = '1';
        it.style.transform = 'none';
      } else {
        it.style.opacity = '0';
        it.style.transform = motion === 'fade' ? 'none' : 'translateY(24px)';
      }
    });
    if (motion === 'none') return;
    const reveal = (el) => {
      if (el.dataset.shown) return;
      el.dataset.shown = '1';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
    };
    const check = () => {
      const vh = window.innerHeight || document.documentElement.clientHeight || 0;
      items.forEach((it) => {
        if (it.dataset.shown) return;
        const r = it.getBoundingClientRect();
        if (r.top < vh * 0.92 && r.bottom > 0) reveal(it);
      });
    };
    this._check = check;
    window.addEventListener('scroll', check, { passive: true });
    window.addEventListener('resize', check);
    check();
    this._t1 = setTimeout(check, 250);
    this._t2 = setTimeout(check, 900);
    this._fallback = setTimeout(() => items.forEach(reveal), 2600);
  }
  renderVals() {
    return {};
  }
}
</script>
